
name: Gerar APK Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v5

      - name: Configurar Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependências
        run: |
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli

      - name: Preparar arquivos web
        run: |
          mkdir -p www
          cp index.html app.js styles.css manifest.webmanifest sw.js icon.svg www/
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.vitrinedojota.app",
            "appName": "Vitrine do Jota",
            "webDir": "www"
          }
          EOF

      - name: Preparar Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Vitrine-do-Jota-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
