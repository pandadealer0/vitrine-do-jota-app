
name: Gerar APK Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5

      - name: Configurar Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Extrair versão 2.0
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name 'vitrine_do_jota_studio_v2.zip' -print -quit)
          test -n "$ZIP" || { echo "ZIP 2.0 não encontrado"; exit 1; }
          mkdir source
          unzip -q "$ZIP" -d source
          INDEX=$(find source -type f -name index.html -print -quit)
          test -n "$INDEX" || { echo "index.html não encontrado"; exit 1; }
          APP_DIR=$(dirname "$INDEX")
          mkdir -p www
          cp "$APP_DIR"/index.html "$APP_DIR"/styles.css "$APP_DIR"/app.js "$APP_DIR"/manifest.webmanifest "$APP_DIR"/sw.js www/

      - name: Instalar Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@^7 @capacitor/android@^7
          npm install -D @capacitor/cli@^7
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.vitrinedojota.app",
            "appName": "Vitrine do Jota Studio",
            "webDir": "www",
            "server": { "androidScheme": "https" }
          }
          EOF

      - name: Preparar Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Vitrine-do-Jota-Studio-2.0-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
