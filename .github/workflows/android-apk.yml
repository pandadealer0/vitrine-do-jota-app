
name: Gerar APK Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar aplicativo
        run: |
          ZIP=$(find . -maxdepth 2 -name '*.zip' -type f | head -n 1)
          test -n "$ZIP" || { echo "ZIP não encontrado"; exit 1; }
          mkdir extracted
          unzip -q "$ZIP" -d extracted
          APP_DIR=$(dirname "$(find extracted -name index.html -type f -print -quit)")
          test -f "$APP_DIR/index.html" || { echo "index.html não encontrado"; exit 1; }
          cd "$APP_DIR"
          npm init -y
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli
          printf '{"appId":"com.vitrinedojota.app","appName":"Vitrine do Jota","webDir":"."}' > capacitor.config.json
          npx cap add android
          npx cap sync android
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: |
          cd "$APP_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Vitrine-do-Jota-APK
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
